name: Validate DirectWrite face cache
on:
  push:
    branches: [validate/directwrite-face-cache-lifetime]
permissions:
  contents: read
jobs:
  direct-write-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: regression-test-only
            ref: a52fa396d89f9572579f87eb1f879e86f58efbe9
          - label: with-fix
            ref: 22fc166ba3b524aedb41bdba5a45bdd1c9146393
    name: ${{ matrix.label }}
    runs-on: windows-2022
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Show toolchain
        run: rustup show
      - name: Run DirectWrite tests
        run: cargo test -p gpui_windows --lib direct_write::tests -- --nocapture --test-threads=1
